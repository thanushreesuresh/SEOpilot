name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      SEOPILOT_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/check_repository.py --history
      - run: python -m pip install -e 'backend[dev]' -c backend/requirements.lock
      - run: npm ci --ignore-scripts && npm test
        working-directory: repository-tools
      - run: npm ci --ignore-scripts && npm test
        working-directory: validation
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend scripts
      - run: npm ci
        working-directory: frontend
      - run: python scripts/export_openapi.py
      - run: npm run generate:types
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api-types.ts
      - run: npm run test:proxy
        working-directory: frontend
      - run: npm run test:build-guard
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
            .tmp/*.png
          retention-days: 1
          if-no-files-found: ignore

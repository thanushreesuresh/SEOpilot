name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/check_repository.py --history
      - run: python -m pip install -e 'backend[dev]' -c backend/requirements.lock
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend scripts
      - run: npm ci
        working-directory: frontend
      - run: python scripts/export_openapi.py
      - run: npm run generate:types
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api-types.ts
      - run: npm run test:proxy
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
